name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      # prisma.config.ts đọc DATABASE_URL khi nạp, kể cả với lệnh generate vốn
      # không kết nối database. CI không có tệp .env nên cấp một giá trị giả ở đây.
      # Không có database nào được liên hệ trong toàn bộ workflow này.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v7

      # Đọc phiên bản pnpm từ trường packageManager trong package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Đọc .nvmrc để CI và container dùng cùng phiên bản Node.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # api và web import @shopflow/shared qua thư mục dist. Trên máy sạch
      # thư mục đó chưa tồn tại, nên phải biên dịch trước khi lint và typecheck,
      # nếu không cả hai bước đều báo không phân giải được module.
      - name: Build shared package
        run: pnpm --filter @shopflow/shared build

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Test tích hợp dựng PostgreSQL thật bằng Testcontainers. Runner của GitHub
      # đã có sẵn Docker nên không cần service container khai báo riêng.
      - name: Integration tests
        run: pnpm --filter @shopflow/api test:int

      - run: pnpm build
