# Cấu hình phục vụ ứng dụng một trang tại chỗ.
#
# Ở production việc này do CloudFront lo bằng custom error response. Tệp này tồn
# tại để chạy đúng bộ ảnh production trên máy mà kiểm chứng được, và nó thực thi
# cùng một quy tắc.

server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      # Tài sản có mã băm trong tên nên không bao giờ đổi nội dung. Cache dài.
      location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
      }

      # index.html không được cache: nó là thứ trỏ tới bản tài sản mới sau mỗi
      # lần triển khai. Cache nó là khách vẫn tải bản cũ sau khi đã lên bản mới.
      location = /index.html {
            add_header Cache-Control "no-cache";
      }

      # Chuyển tiếp lời gọi API sang service api. Trên production việc này do
      # CloudFront lo, bằng một origin thứ hai trỏ tới ALB — cùng một hình dạng.
      location /api/ {
            # nginx phân giải tên upstream đúng một lần lúc khởi động và giữ mãi
            # IP đó. Hệ quả: khởi động trước khi api có mặt là chết ngay, và api
            # đổi IP sau khi khởi động lại thì nginx vẫn gọi vào địa chỉ cũ.
            # Đưa tên vào biến buộc nginx phân giải theo từng request, qua máy chủ
            # DNS nội bộ của Docker.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://api:3000;

            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Mọi đường dẫn không khớp tệp nào đều trả index.html, để vue-router xử lý.
      # Không có dòng này thì mở thẳng /don-hang/SF-260819-0001 trả 404, dù đường
      # dẫn đó hoạt động khi bấm từ trong ứng dụng.
      location / {
            try_files $uri $uri/ /index.html;
      }
}
