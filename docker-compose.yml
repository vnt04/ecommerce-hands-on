name: shopflow

# Cấu hình dùng chung cho ba service chạy Node.
#
# Vì sao node_modules là volume riêng: mã nguồn được bind mount từ máy chủ,
# nếu không có volume che lại thì node_modules của máy chủ sẽ đè lên bản cài
# trong image — hai bên khác kiến trúc và khác phiên bản Node.
#
# Vì sao khai báo user: Docker chạy trực tiếp trên Linux không tự ánh xạ uid,
# nên tệp do container tạo ra sẽ thuộc về uid của container. Lấy uid của máy
# chủ từ .env để tệp vẫn sửa được từ bên ngoài. Docker Desktop trên macOS và
# Windows tự ánh xạ nên giá trị này không gây ảnh hưởng ở đó.
x-node-service: &node-service
  build:
    context: .
    dockerfile: Dockerfile.dev
    args:
      UID: ${DOCKER_UID}
      GID: ${DOCKER_GID}
  user: '${DOCKER_UID}:${DOCKER_GID}'
  volumes:
    - .:/app
    - node-modules-root:/app/node_modules
    - node-modules-shared:/app/packages/shared/node_modules
    - node-modules-api:/app/apps/api/node_modules
    - node-modules-web:/app/apps/web/node_modules

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Kho ảnh nói giao thức S3. Ở production đây là S3 thật; chỉ khác điểm cuối và
  # thông tin xác thực, còn mã trong apps/api không đổi một dòng nào.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${MINIO_PORT}:9000'
      - '${MINIO_CONSOLE_PORT}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Biên dịch packages/shared ở chế độ theo dõi. api và web đọc kết quả
  # qua thư mục dist nằm trên bind mount, nên chỉ cần một tiến trình biên dịch.
  shared:
    <<: *node-service
    command: pnpm --filter @shopflow/shared dev

  api:
    <<: *node-service
    # Build shared một lần trước khi khởi động để không phụ thuộc thứ tự
    # so với service shared. Lệnh này chạy dưới một giây.
    command: sh -c "pnpm --filter @shopflow/shared build && pnpm --filter @shopflow/api dev"
    environment:
      PORT: 3000
      # Trong mạng nội bộ của Compose, database nằm ở hostname `db` và cổng 5432,
      # không phụ thuộc POSTGRES_PORT vốn chỉ là cổng publish ra máy chủ.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      # Điểm cuối nội bộ để api ghi ảnh lên. Trình duyệt không dùng địa chỉ này.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # Đường dẫn trình duyệt dùng để tải ảnh về. Khác điểm cuối bên trên vì
      # hostname `minio` chỉ phân giải được trong mạng nội bộ của Compose.
      S3_PUBLIC_URL: http://localhost:${MINIO_PORT}
    ports:
      - '${API_PORT}:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    <<: *node-service
    command: sh -c "pnpm --filter @shopflow/shared build && pnpm --filter @shopflow/web dev"
    environment:
      # Tên service trong mạng nội bộ của Compose, không phải localhost.
      API_URL: http://api:3000
      WATCH_POLLING: ${WATCH_POLLING}
    ports:
      - '${WEB_PORT}:5173'
    depends_on:
      - api

volumes:
  db-data:
  minio-data:
  node-modules-root:
  node-modules-shared:
  node-modules-api:
  node-modules-web:
